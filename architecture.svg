<svg viewBox="0 0 920 660" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Mono',monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#666"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#999"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0,8 3.5,0 7" fill="#c8a430"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="920" height="660" fill="#f7f5f0"/>

  <!-- title -->
  <text x="460" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#222" letter-spacing="1">KAKAPO / CORPUSQUERY — SYSTEM ARCHITECTURE</text>

  <!-- ── Docker border ── -->
  <rect x="188" y="42" width="694" height="560" rx="10" fill="#eef4ff" stroke="#7799cc" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="202" y="58" font-size="9" fill="#7799cc" letter-spacing="1">DOCKER CONTAINER</text>

  <!-- ── Browser (left) ── -->
  <rect x="16" y="150" width="134" height="200" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.5"/>
  <rect x="16" y="150" width="134" height="22" rx="8" fill="#dddddd"/>
  <rect x="16" y="161" width="134" height="11" fill="#dddddd"/>
  <text x="83" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#555">BROWSER</text>
  <text x="83" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#444">Annotator</text>
  <text x="83" y="207" text-anchor="middle" font-size="9" fill="#777">corpusquery-cc.html</text>
  <text x="83" y="220" text-anchor="middle" font-size="9" fill="#777">corpusquery-bt.html</text>
  <text x="83" y="233" text-anchor="middle" font-size="9" fill="#777">admin.html</text>
  <line x1="30" y1="248" x2="136" y2="248" stroke="#dddddd" stroke-width="1"/>
  <text x="83" y="265" text-anchor="middle" font-size="9" font-weight="600" fill="#444">Guest</text>
  <text x="83" y="280" text-anchor="middle" font-size="9" fill="#777">corpusquery-bt</text>
  <text x="83" y="294" text-anchor="middle" font-size="9" fill="#777">-public.html</text>
  <text x="83" y="342" text-anchor="middle" font-size="8" fill="#bbbbbb">Firefox / Chrome</text>

  <!-- ── nginx ── -->
  <rect x="204" y="162" width="112" height="56" rx="7" fill="#ede8fa" stroke="#8866cc" stroke-width="1.5"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#5533aa">nginx</text>
  <text x="260" y="201" text-anchor="middle" font-size="9" fill="#7755bb">reverse proxy</text>
  <text x="260" y="212" text-anchor="middle" font-size="9" fill="#7755bb">TLS termination</text>

  <!-- ── FastAPI box ── -->
  <rect x="344" y="70" width="316" height="236" rx="8" fill="#edf5e8" stroke="#4e7818" stroke-width="1.5"/>
  <rect x="344" y="70" width="316" height="24" rx="8" fill="#4e7818"/>
  <rect x="344" y="83" width="316" height="11" fill="#4e7818"/>
  <text x="502" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">FASTAPI  (port 8000)</text>

  <rect x="358" y="104" width="132" height="38" rx="5" fill="#ffffff" stroke="#88aa44" stroke-width="1"/>
  <text x="424" y="121" text-anchor="middle" font-size="10" font-weight="600" fill="#222">auth_routes.py</text>
  <text x="424" y="135" text-anchor="middle" font-size="9" fill="#888">login · logout · /me</text>

  <rect x="504" y="104" width="140" height="38" rx="5" fill="#ffffff" stroke="#88aa44" stroke-width="1"/>
  <text x="574" y="121" text-anchor="middle" font-size="10" font-weight="600" fill="#222">search.py</text>
  <text x="574" y="135" text-anchor="middle" font-size="9" fill="#888">search · annotate · NL2SQL</text>

  <rect x="358" y="152" width="132" height="38" rx="5" fill="#ffffff" stroke="#88aa44" stroke-width="1"/>
  <text x="424" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#222">admin_routes.py</text>
  <text x="424" y="183" text-anchor="middle" font-size="9" fill="#888">users · config · import</text>

  <rect x="504" y="152" width="140" height="38" rx="5" fill="#ffffff" stroke="#88aa44" stroke-width="1"/>
  <text x="574" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#222">main.py</text>
  <text x="574" y="183" text-anchor="middle" font-size="9" fill="#888">app init · middleware</text>

  <!-- frontend sub-box -->
  <rect x="358" y="200" width="286" height="94" rx="5" fill="#ddf0d8" stroke="#88aa44" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="502" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#4e7818">FRONTEND  (static HTML/JS)</text>
  <text x="424" y="232" text-anchor="middle" font-size="9" fill="#555">corpusquery-cc.html</text>
  <text x="424" y="246" text-anchor="middle" font-size="9" fill="#555">corpusquery-bt.html</text>
  <text x="424" y="260" text-anchor="middle" font-size="9" fill="#555">corpusquery-bt-public.html</text>
  <text x="580" y="232" text-anchor="middle" font-size="9" fill="#555">admin.html</text>
  <text x="580" y="246" text-anchor="middle" font-size="9" fill="#555">data_management.html</text>
  <text x="580" y="260" text-anchor="middle" font-size="9" fill="#555">edit_*.html · home.html</text>
  <text x="502" y="281" text-anchor="middle" font-size="8" fill="#999">served statically by FastAPI</text>

  <!-- ── Service layer ── -->
  <rect x="204" y="346" width="460" height="232" rx="8" fill="#fff4ee" stroke="#b86820" stroke-width="1.5"/>
  <rect x="204" y="346" width="460" height="24" rx="8" fill="#b86820"/>
  <rect x="204" y="359" width="460" height="11" fill="#b86820"/>
  <text x="434" y="364" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">BACKEND / SERVICE LAYER</text>

  <rect x="218" y="382" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="285" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#222">query_service.py</text>
  <text x="285" y="415" text-anchor="middle" font-size="9" fill="#888">SQL builder · filters</text>
  <text x="285" y="427" text-anchor="middle" font-size="9" fill="#888">pagination · keyword</text>

  <rect x="366" y="382" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="433" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#222">database.py</text>
  <text x="433" y="415" text-anchor="middle" font-size="9" fill="#888">schema init · migrations</text>
  <text x="433" y="427" text-anchor="middle" font-size="9" fill="#888">connections · indexes</text>

  <rect x="514" y="382" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="581" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#222">auth.py</text>
  <text x="581" y="415" text-anchor="middle" font-size="9" fill="#888">bcrypt · sessions</text>
  <text x="581" y="427" text-anchor="middle" font-size="9" fill="#888">role checks · cookies</text>

  <rect x="218" y="446" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="285" y="465" text-anchor="middle" font-size="10" font-weight="600" fill="#222">cc_importer.py</text>
  <text x="285" y="479" text-anchor="middle" font-size="9" fill="#888">CSV/JSON import</text>
  <text x="285" y="491" text-anchor="middle" font-size="9" fill="#888">author heuristic</text>

  <rect x="366" y="446" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="433" y="465" text-anchor="middle" font-size="10" font-weight="600" fill="#222">bt_importer.py</text>
  <text x="433" y="479" text-anchor="middle" font-size="9" fill="#888">per-party CSV bundles</text>
  <text x="433" y="491" text-anchor="middle" font-size="9" fill="#888">5 parties · 3 families</text>

  <rect x="514" y="446" width="134" height="52" rx="5" fill="#ffffff" stroke="#cc9966" stroke-width="1"/>
  <text x="581" y="465" text-anchor="middle" font-size="10" font-weight="600" fill="#222">nl2sql.py</text>
  <text x="581" y="479" text-anchor="middle" font-size="9" fill="#888">prompt builder</text>
  <text x="581" y="491" text-anchor="middle" font-size="9" fill="#888">schema validate · retry</text>

  <text x="218" y="516" font-size="9" fill="#996644">Roles:  admin (user mgmt)  ·  annotator (full access)  ·  guest (is_public=1 only)</text>

  <!-- ── Data volume ── -->
  <rect x="690" y="70" width="172" height="270" rx="8" fill="#fffbe8" stroke="#c8a430" stroke-width="1.5"/>
  <rect x="690" y="70" width="172" height="24" rx="8" fill="#c8a430"/>
  <rect x="690" y="83" width="172" height="11" fill="#c8a430"/>
  <text x="776" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">DATA VOLUME</text>
  <text x="706" y="110" font-size="9" fill="#888">/srv/kakapo/data</text>

  <rect x="703" y="120" width="144" height="56" rx="5" fill="#ffffff" stroke="#c8a430" stroke-width="1"/>
  <text x="775" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#222">climatechange.db</text>
  <text x="775" y="155" text-anchor="middle" font-size="9" fill="#888">documents · paragraphs</text>
  <text x="775" y="168" text-anchor="middle" font-size="9" fill="#888">spans · edit_history</text>

  <rect x="703" y="188" width="144" height="56" rx="5" fill="#ffffff" stroke="#c8a430" stroke-width="1"/>
  <text x="775" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#222">bundestag.db</text>
  <text x="775" y="223" text-anchor="middle" font-size="9" fill="#888">bt_documents</text>
  <text x="775" y="236" text-anchor="middle" font-size="9" fill="#888">bt_sentences</text>

  <rect x="703" y="256" width="144" height="38" rx="5" fill="#ffffff" stroke="#c8a430" stroke-width="1"/>
  <text x="775" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#222">users.json</text>
  <text x="775" y="288" text-anchor="middle" font-size="9" fill="#888">bcrypt hashes · roles</text>

  <!-- ── External NL2SQL API ── -->
  <rect x="690" y="372" width="172" height="72" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="776" y="400" text-anchor="middle" font-size="10" font-weight="700" fill="#555">NL2SQL API</text>
  <text x="776" y="416" text-anchor="middle" font-size="9" fill="#888">Groq / OpenAI-compat</text>
  <text x="776" y="430" text-anchor="middle" font-size="9" fill="#888">external · HTTPS</text>

  <!-- ── Arrows ── -->
  <!-- Browser to nginx -->
  <line x1="150" y1="194" x2="201" y2="194" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="175" y="188" text-anchor="middle" font-size="8" fill="#666">HTTPS</text>

  <!-- nginx to FastAPI -->
  <line x1="316" y1="194" x2="341" y2="194" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FastAPI to Service Layer (down) -->
  <line x1="502" y1="306" x2="502" y2="343" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Service Layer to Data Volume -->
  <line x1="664" y1="422" x2="687" y2="282" stroke="#c8a430" stroke-width="1.5" marker-end="url(#arro)"/>

  <!-- nl2sql to External API -->
  <line x1="648" y1="472" x2="687" y2="408" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrd)"/>

  <!-- ── Legend ── -->
  <rect x="16" y="590" width="886" height="58" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="32" y="607" font-size="9" font-weight="700" fill="#555">LEGEND</text>
  <rect x="32" y="613" width="11" height="11" rx="2" fill="#eef4ff" stroke="#7799cc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="48" y="623" font-size="9" fill="#555">Docker container</text>
  <rect x="155" y="613" width="11" height="11" rx="2" fill="#edf5e8" stroke="#4e7818" stroke-width="1"/>
  <text x="171" y="623" font-size="9" fill="#555">FastAPI / routes</text>
  <rect x="268" y="613" width="11" height="11" rx="2" fill="#fff4ee" stroke="#b86820" stroke-width="1"/>
  <text x="284" y="623" font-size="9" fill="#555">Service layer</text>
  <rect x="370" y="613" width="11" height="11" rx="2" fill="#fffbe8" stroke="#c8a430" stroke-width="1"/>
  <text x="386" y="623" font-size="9" fill="#555">Data volume (SQLite)</text>
  <rect x="506" y="613" width="11" height="11" rx="2" fill="#ede8fa" stroke="#8866cc" stroke-width="1"/>
  <text x="522" y="623" font-size="9" fill="#555">nginx (production HTTPS)</text>
  <rect x="668" y="613" width="11" height="11" rx="2" fill="#f5f5f5" stroke="#999999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="684" y="623" font-size="9" fill="#555">External API</text>

  <line x1="32" y1="638" x2="58" y2="638" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="63" y="642" font-size="9" fill="#555">HTTP request/response</text>
  <line x1="208" y1="638" x2="234" y2="638" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="239" y="642" font-size="9" fill="#555">External HTTPS (NL2SQL)</text>
  <line x1="410" y1="638" x2="436" y2="638" stroke="#c8a430" stroke-width="1.5" marker-end="url(#arro)"/>
  <text x="441" y="642" font-size="9" fill="#555">SQLite reads/writes</text>
</svg>
